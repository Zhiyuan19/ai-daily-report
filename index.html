<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 技术情报日报</title>
<style>

:root {
    --bg: #ffffff;
    --text: #1a1a2e;
    --muted: #6b7280;
    --accent: #3b82f6;
    --accent-light: #dbeafe;
    --accent-hover: #2563eb;
    --border: #e5e7eb;
    --code-bg: #f8fafc;
    --heading: #111827;
    --card-bg: #f9fafb;
    --shadow: 0 4px 16px rgba(0,0,0,0.08);
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg: #0f172a;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #60a5fa;
        --accent-light: #1e3a5f;
        --accent-hover: #93c5fd;
        --border: #334155;
        --code-bg: #1e293b;
        --heading: #f1f5f9;
        --card-bg: #1e293b;
        --shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    line-height: 1.75;
    color: var(--text);
    background: var(--bg);
}
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); text-decoration: underline; }
.container {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
}
.home-hero {
    text-align: center;
    padding: 4rem 1.5rem 3rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 3rem;
}
.home-hero .eyebrow {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 0.75rem;
}
.home-hero h1 {
    font-size: 2.2rem;
    font-weight: 800;
    color: var(--heading);
    margin-bottom: 0.5rem;
    line-height: 1.2;
}
.home-hero .subtitle { color: var(--muted); font-size: 1rem; margin-bottom: 2rem; }
.toc-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1.25rem;
    margin-top: 2rem;
}
.toc-card {
    display: block;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem 1.75rem;
    transition: box-shadow 0.2s, border-color 0.2s, transform 0.15s;
    text-decoration: none;
    color: inherit;
}
.toc-card:hover {
    box-shadow: var(--shadow);
    border-color: var(--accent);
    transform: translateY(-2px);
    text-decoration: none;
    color: inherit;
}
.toc-card .card-num { font-size: 0.75rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.4rem; }
.toc-card .card-title { font-size: 1.05rem; font-weight: 700; color: var(--heading); margin-bottom: 0.4rem; line-height: 1.3; }
.toc-card .card-desc { font-size: 0.825rem; color: var(--muted); line-height: 1.5; }
.section-header {
    padding: 2rem 0 1.5rem;
    border-bottom: 2px solid var(--border);
    margin-bottom: 2.5rem;
}
.section-header .breadcrumb { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.5rem; }
.section-header .breadcrumb a { color: var(--accent); }
.section-header h1 { font-size: 1.75rem; font-weight: 800; color: var(--heading); line-height: 1.2; }
.section-header .section-meta { font-size: 0.875rem; color: var(--muted); margin-top: 0.4rem; }
.source-block { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 2rem; }
.source-block + .source-block { margin-top: 0; }
.source-block h3 { font-size: 1.05rem; font-weight: 700; color: var(--heading); margin-bottom: 0.5rem; }
.source-block .source-meta { font-size: 0.78rem; color: var(--muted); margin-bottom: 0.75rem; }
.source-block .source-meta span { margin-right: 1rem; }
.field-label { font-size: 0.78rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 1rem; margin-bottom: 0.25rem; }
.field-label:first-child { margin-top: 0; }
p { margin-bottom: 0.85rem; }
p:last-child { margin-bottom: 0; }
ul { padding-left: 1.4rem; margin-bottom: 0.85rem; }
li { margin-bottom: 0.25rem; }
code { font-family: "SF Mono", "Fira Code", Consolas, monospace; font-size: 0.82em; background: var(--code-bg); padding: 0.15em 0.4em; border-radius: 4px; color: #c7254e; }
@media (prefers-color-scheme: dark) { code { color: #f78c6c; } }
pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; overflow-x: auto; margin: 1rem 0; }
pre code { background: none; padding: 0; color: var(--text); font-size: 0.82rem; }
table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.875rem; }
th, td { border: 1px solid var(--border); padding: 0.5rem 0.75rem; text-align: left; }
th { background: var(--code-bg); font-weight: 600; }
tr:nth-child(even) td { background: rgba(0,0,0,0.02); }
@media (prefers-color-scheme: dark) { tr:nth-child(even) td { background: rgba(255,255,255,0.03); } }
hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
.back-to-top { display: inline-block; margin-top: 3rem; font-size: 0.875rem; color: var(--muted); }
.back-to-top:hover { color: var(--accent); text-decoration: none; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

</style>
</head>
<body>
<div class="container">
    <div class="home-hero">
        <div class="eyebrow">AI 技术情报日报</div>
        <h1>AI 技术情报日报</h1>
        <div class="subtitle">2026年4月17日 · 近24小时</div>
    </div>
    <div class="toc-grid">
<a class="toc-card" href="section-1.html">

    <div class="card-desc">官方博客新动态 · 3条官方重大发布</div>

    <div class="card-desc">开源工具 & 模型更新 · 3个重磅更新</div>

<a class="toc-card" href="section-5.html">

<a class="toc-card" href="section-6.html">
    <div class="card-num">板块 6</div>

</a>
    </div>
</div>
</body>
</html>
